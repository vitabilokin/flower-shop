<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer petals: wide open cups, rx > ry -->
  <ellipse cx="50" cy="27" rx="13" ry="11" fill="#ef9a9a" transform="rotate(0,50,50)" opacity="0.82"/>
  <ellipse cx="50" cy="27" rx="13" ry="11" fill="#ef9a9a" transform="rotate(60,50,50)" opacity="0.82"/>
  <ellipse cx="50" cy="27" rx="13" ry="11" fill="#ef9a9a" transform="rotate(120,50,50)" opacity="0.82"/>
  <ellipse cx="50" cy="27" rx="13" ry="11" fill="#ef9a9a" transform="rotate(180,50,50)" opacity="0.82"/>
  <ellipse cx="50" cy="27" rx="13" ry="11" fill="#ef9a9a" transform="rotate(240,50,50)" opacity="0.82"/>
  <ellipse cx="50" cy="27" rx="13" ry="11" fill="#ef9a9a" transform="rotate(300,50,50)" opacity="0.82"/>
  <!-- Middle petals: cupped, slightly taller than wide, offset 36° -->
  <ellipse cx="50" cy="35" rx="8" ry="12" fill="#e53935" transform="rotate(36,50,50)" opacity="0.90"/>
  <ellipse cx="50" cy="35" rx="8" ry="12" fill="#e53935" transform="rotate(108,50,50)" opacity="0.90"/>
  <ellipse cx="50" cy="35" rx="8" ry="12" fill="#e53935" transform="rotate(180,50,50)" opacity="0.90"/>
  <ellipse cx="50" cy="35" rx="8" ry="12" fill="#e53935" transform="rotate(252,50,50)" opacity="0.90"/>
  <ellipse cx="50" cy="35" rx="8" ry="12" fill="#e53935" transform="rotate(324,50,50)" opacity="0.90"/>
  <!-- Inner spiral bud: narrow, tall, very close to center — KEY differentiator from peony -->
  <ellipse cx="50" cy="43" rx="4.5" ry="8" fill="#c62828" transform="rotate(0,50,50)"/>
  <ellipse cx="50" cy="43" rx="4.5" ry="8" fill="#c62828" transform="rotate(120,50,50)"/>
  <ellipse cx="50" cy="43" rx="4.5" ry="8" fill="#c62828" transform="rotate(240,50,50)"/>
  <ellipse cx="50" cy="45" rx="3" ry="5.5" fill="#b71c1c" transform="rotate(60,50,50)"/>
  <ellipse cx="50" cy="45" rx="3" ry="5.5" fill="#b71c1c" transform="rotate(180,50,50)"/>
  <ellipse cx="50" cy="45" rx="3" ry="5.5" fill="#b71c1c" transform="rotate(300,50,50)"/>
  <!-- Dark center dot — clearly visible, tight bud core -->
  <circle cx="50" cy="50" r="4.5" fill="#880e0e"/>
</svg>
