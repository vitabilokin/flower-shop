<section class="quiz-preview">
  <div class="container">
    <span class="quiz-preview__eyebrow">Підбір букета</span>
    <h2 class="quiz-preview__title">Не знаєте, що обрати?</h2>
    <p class="quiz-preview__subtitle">Дайте відповідь на кілька питань — і ми підкажемо ідеальний букет.</p>

    <div class="quiz-preview__moods">
      @for (mood of moods; track mood) {
        <button class="chip" (click)="goToQuiz()">{{ mood }}</button>
      }
    </div>

    <a class="btn btn-primary" routerLink="/quiz">Пройти підбір букета</a>
  </div>
</section>
