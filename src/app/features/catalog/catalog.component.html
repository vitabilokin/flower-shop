<section class="catalog" id="catalog">
  <div class="container">
    <span class="catalog__eyebrow">Каталог</span>
    <h2 class="catalog__title">Букети на будь-який настрій</h2>

    <div class="catalog__grid">
      @for (b of bouquets; track b.id) {
        <article class="card" [class.card--highlight]="highlightedId() === b.id">
          <a [routerLink]="['/catalog', b.id]" class="card__link">
            <div class="card__photo">
              <img [src]="b.photo" [alt]="b.name" loading="lazy" />
              @if (b.tag) {
                <span class="card__tag card__tag--{{ b.tagTone }}">{{ b.tag }}</span>
              }
            </div>
            <div class="card__text">
              <h3 class="card__name">{{ b.name }}</h3>
              <p class="card__price">{{ b.price }} ₴</p>
              <p class="card__subtitle">{{ b.subtitle }}</p>
            </div>
          </a>
          <div class="card__actions">
            <button class="btn btn-primary card__btn" (click)="addToCart(b)">
              {{ addedIds().has(b.id) ? 'Додано ✓' : 'Додати в корзину' }}
            </button>
            <button class="btn btn-ghost-pink card__btn" (click)="quickOrder(b)">Швидке замовлення</button>
          </div>
        </article>
      }
    </div>
  </div>
</section>
