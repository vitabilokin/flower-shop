<div class="canvas">
  <div class="canvas__toolbar">
    <button class="btn btn-ghost-pink canvas__clear" (click)="clear()">Очистити</button>
    <span class="canvas__count">
      {{ constructorService.totalCount() }} / {{ constructorService.selectedSize().maxFlowers }} квіток
    </span>
  </div>

  <svg class="canvas__svg" viewBox="0 0 600 500" [class.canvas__svg--idle]="isEmpty()">
    <!-- stems -->
    @for (item of placedFlowers(); track item.id) {
      <line
        [attr.x1]="item.x"
        [attr.y1]="item.y + 14"
        [attr.x2]="300"
        [attr.y2]="360"
        stroke="#4caf50"
        stroke-width="2"
        opacity="0.55"
      />
    }

    @if (isBoxWrapping()) {
      <g class="box">
        <rect x="190" y="388" width="220" height="68" rx="4" [attr.fill]="constructorService.selectedWrapping().color" stroke="#c9a063" stroke-width="2" />
        <rect x="178" y="362" width="244" height="28" rx="5" [attr.fill]="constructorService.selectedWrapping().color" stroke="#c9a063" stroke-width="2" />
      </g>
    } @else {
      <g class="vase">
        <path d="M220 420 L180 350 L420 350 L380 420 Z" fill="#f0e6d3" stroke="#d4a574" stroke-width="2" />
        <rect x="260" y="320" width="80" height="35" rx="5" fill="#f0e6d3" stroke="#d4a574" stroke-width="2" />
        <path d="M220 420 L185 370 L415 370 L380 420 Z" fill="rgba(135,206,235,0.3)" />
        <path d="M200 380 Q210 360 215 375" stroke="white" stroke-width="3" fill="none" opacity="0.6" />
      </g>

      @if (isKraftWrapping()) {
        <path
          d="M190 345 L410 345 L372 458 L228 458 Z"
          [attr.fill]="constructorService.selectedWrapping().color"
          opacity="0.95"
        />
      }

      @if (isOrganzaWrapping()) {
        <path
          d="M188 340 L412 340 L378 460 L222 460 Z"
          [attr.fill]="constructorService.selectedWrapping().color"
          opacity="0.45"
        />
      }
    }

    @if (showRibbon()) {
      <g class="ribbon">
        <rect x="185" y="392" width="230" height="14" [attr.fill]="constructorService.selectedRibbon().color" />
        <path d="M280 380 L300 400 L280 416 Z" [attr.fill]="constructorService.selectedRibbon().color" />
        <path d="M320 380 L300 400 L320 416 Z" [attr.fill]="constructorService.selectedRibbon().color" />
        <circle cx="300" cy="400" r="7" [attr.fill]="constructorService.selectedRibbon().color" stroke="#0003" stroke-width="1" />
      </g>
    }

    <!-- flowers -->
    @for (item of placedFlowers(); track item.id) {
      <g class="flower-instance" [attr.transform]="'translate(' + item.x + ',' + item.y + ') rotate(' + item.rotation + ')'">
        <g
          class="flower-instance__bloom"
          [class.flower-instance__bloom--removing]="constructorService.removingIds().has(item.id)"
          appFlowerIcon
          [type]="item.flower.type"
          [petalColor]="item.flower.petalColor"
          [centerColor]="item.flower.centerColor"
          [showStem]="false"
        ></g>
      </g>
    }
  </svg>
</div>
