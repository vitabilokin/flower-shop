<header class="nav" [class.nav--scrolled]="scrolled()">
  <div class="container nav__inner">
    <a class="nav__logo" href="#hero" (click)="$event.preventDefault(); scrollTo('hero')">Posy</a>

    <nav class="nav__links">
      @for (link of links; track link.id) {
        <a href="#{{ link.id }}" (click)="$event.preventDefault(); scrollTo(link.id)">{{ link.label }}</a>
      }
    </nav>

    <button class="btn btn-primary" (click)="scrollTo('catalog')">Замовити букет</button>
  </div>
</header>
