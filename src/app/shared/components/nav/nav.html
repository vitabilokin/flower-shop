<header class="nav" [class.nav--scrolled]="solid()">
  <div class="nav__inner">
    <a class="nav__logo logo" routerLink="/">
      <span>P</span>
      <svg width="28" height="28" viewBox="0 0 30 30">
        <g class="bloom-petals" fill="#ff4d8d">
          <circle cx="15" cy="7" r="5" />
          <circle cx="22.61" cy="12.53" r="5" />
          <circle cx="19.7" cy="21.47" r="5" />
          <circle cx="10.3" cy="21.47" r="5" />
          <circle cx="7.39" cy="12.53" r="5" />
        </g>
        <circle cx="15" cy="15" r="5" fill="#ffce3f" />
      </svg>
      <span>sy</span>
    </a>

    <nav class="nav__links">
      <a routerLink="/catalog" routerLinkActive="nav__link--active">Каталог</a>
      <a routerLink="/quiz" routerLinkActive="nav__link--active">Підбір букета</a>
      @for (link of sectionLinks; track link.id) {
        <a href="#{{ link.id }}" (click)="$event.preventDefault(); goToSection(link.id)">{{ link.label }}</a>
      }
    </nav>

    <div class="nav__actions">
      <button class="cart-btn" (click)="toggleCart()" aria-label="Корзина">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path
            d="M3 4h2l1.4 9.4A2 2 0 0 0 8.4 15h8.2a2 2 0 0 0 2-1.6L20 7H6"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <circle cx="9" cy="20" r="1.6" fill="currentColor" />
          <circle cx="17" cy="20" r="1.6" fill="currentColor" />
        </svg>
        @if (cartService.totalCount() > 0) {
          <span class="cart-badge" [class.cart-badge--bump]="badgeBump()">
            {{ cartService.totalCount() }}
          </span>
        }
      </button>

      <button class="btn btn-primary" routerLink="/order">Замовити букет</button>
    </div>
  </div>
</header>
